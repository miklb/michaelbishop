name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the syndication step to commit captured syndication URLs back to main.
permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so the syndication commit-back can push to main.
          token: ${{ secrets.GITHUB_TOKEN }}
          # fetch-depth 2 so we can diff against the previous commit to find
          # which posts changed (scopes syndication to new posts only).
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci
      - name: Build (11ty)
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}

      # --- Bridgy syndication (notes/replies with mp-syndicate-to) ---
      # Bridgy fetches the live page, so wait for the deploy to propagate.
      # Scope syndication to posts changed in this push (avoids re-sending every
      # post and getting "already published" noise from Bridgy).
      # send-webmentions.js writes captured syndication URLs into frontmatter;
      # we commit those back with [skip ci] so it doesn't trigger another deploy.
      - name: Syndicate changed posts to Bridgy
        run: |
          sleep 45
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'content/notes' 'content/replies' | grep '\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed notes/replies to syndicate."
            exit 0
          fi
          echo "Changed posts:"; echo "$CHANGED"
          npm run webmention -- $CHANGED

      - name: Commit syndication URLs
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            git commit -m "chore: capture syndication URLs [skip ci]"
            git push
          else
            echo "No syndication URL changes to commit."
          fi
