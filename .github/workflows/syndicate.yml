name: Syndicate to Bridgy

# Build + deploy are handled by Cloudflare Workers Builds (native Git
# integration), so this workflow does ONLY post-deploy syndication.
# It needs no Cloudflare secrets — it just pings Bridgy and commits the
# captured syndication URLs back to the repo.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: syndicate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history. `github.event.before` is as far back as the push is
          # long, so a shallow clone turns any multi-commit push into
          # "fatal: bad object" — which used to be swallowed, leaving the run
          # green with nothing syndicated.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - name: Determine changed posts
        id: changed
        run: |
          set -euo pipefail
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "::notice::before-SHA unusable ($BEFORE) — diffing against HEAD~1"
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          # git diff runs under `set -e` so a failure stops the run. Only the
          # grep is allowed to come back empty: previously one `|| true`
          # covered both, so a broken diff was indistinguishable from
          # "no posts changed" and the whole job skipped silently.
          DIFF="$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" \
            -- 'content/notes' 'content/replies' 'content/prints' 'content/photos')"
          CHANGED="$(printf '%s\n' "$DIFF" | grep '\.md$' || true)"
          echo "Comparing $BEFORE..${{ github.sha }}"
          echo "Changed posts: ${CHANGED:-(none)}"
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for this commit's build to be live
        if: steps.changed.outputs.files != ''
        run: |
          # An edited post's URL serves 200 from the PREVIOUS build during the
          # deploy window, so Bridgy would capture stale content. Wait until
          # the live build-info.json stamp matches this commit (or a newer
          # build that already contains it) before syndicating.
          is_live() {
            LIVE=$(curl -fsS https://michaelbishop.me/build-info.json | jq -r .sha) || return 1
            [ "$LIVE" = "${{ github.sha }}" ] && return 0
            git fetch -q --depth=50 origin "$LIVE" 2>/dev/null || return 1
            git merge-base --is-ancestor "${{ github.sha }}" "$LIVE" 2>/dev/null
          }
          for i in $(seq 1 60); do
            if is_live; then echo "New build is live."; exit 0; fi
            echo "Waiting for deploy... ($i)"; sleep 10
          done
          echo "Timed out waiting for this commit's build — refusing to syndicate stale content."
          exit 1

      - name: Syndicate changed posts
        if: steps.changed.outputs.files != ''
        run: |
          echo "Changed posts:"; printf '%s\n' "${{ steps.changed.outputs.files }}"
          # send-webmentions.js additionally polls each post's own URL (covers
          # brand-new pages still propagating), then pings Bridgy.
          npm run webmention -- ${{ steps.changed.outputs.files }}

      - name: Verify the posts actually syndicated
        if: steps.changed.outputs.files != ''
        run: |
          # Check the outcome, not the steps. Every stage above can no-op
          # quietly, and a green run has twice meant "published to the site,
          # never reached Bluesky". Any changed post that wanted a
          # syndication URL and has none fails the run.
          node scripts/check-syndication.js ${{ steps.changed.outputs.files }}

      - name: Commit captured syndication URLs
        if: steps.changed.outputs.files != ''
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            # [skip ci] keeps both this workflow and Cloudflare Workers Builds
            # from rebuilding on the syndication commit-back.
            git commit -m "chore: capture syndication URLs [skip ci]"
            # main may have moved during the deploy-wait window (an unrelated
            # push races this workflow's ~2 minutes of waiting), so rebase and
            # retry rather than failing the run after syndication succeeded.
            for i in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                exit 0
              fi
              echo "Push rejected, retrying ($i)..."
              sleep 5
            done
            echo "Could not push syndication URLs after 3 attempts."
            exit 1
          else
            echo "No syndication URL changes to commit."
          fi
