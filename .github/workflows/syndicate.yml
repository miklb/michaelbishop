name: Syndicate to Bridgy

# Build + deploy are handled by Cloudflare Workers Builds (native Git
# integration), so this workflow does ONLY post-deploy syndication.
# It needs no Cloudflare secrets — it just pings Bridgy and commits the
# captured syndication URLs back to the repo.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: syndicate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  syndicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Diff against the previous commit to find changed posts.
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "npm"

      - run: npm ci

      - name: Determine changed posts
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          CHANGED=$(git diff --name-only --diff-filter=AM "$BEFORE" "${{ github.sha }}" -- 'content/notes' 'content/replies' | grep '\.md$' || true)
          {
            echo "files<<EOF"
            echo "$CHANGED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for this commit's build to be live
        if: steps.changed.outputs.files != ''
        run: |
          # An edited post's URL serves 200 from the PREVIOUS build during the
          # deploy window, so Bridgy would capture stale content. Wait until
          # the live build-info.json stamp matches this commit (or a newer
          # build that already contains it) before syndicating.
          is_live() {
            LIVE=$(curl -fsS https://michaelbishop.me/build-info.json | jq -r .sha) || return 1
            [ "$LIVE" = "${{ github.sha }}" ] && return 0
            git fetch -q --depth=50 origin "$LIVE" 2>/dev/null || return 1
            git merge-base --is-ancestor "${{ github.sha }}" "$LIVE" 2>/dev/null
          }
          for i in $(seq 1 60); do
            if is_live; then echo "New build is live."; exit 0; fi
            echo "Waiting for deploy... ($i)"; sleep 10
          done
          echo "Timed out waiting for this commit's build — refusing to syndicate stale content."
          exit 1

      - name: Syndicate changed posts
        if: steps.changed.outputs.files != ''
        run: |
          echo "Changed posts:"; printf '%s\n' "${{ steps.changed.outputs.files }}"
          # send-webmentions.js additionally polls each post's own URL (covers
          # brand-new pages still propagating), then pings Bridgy.
          npm run webmention -- ${{ steps.changed.outputs.files }}

      - name: Commit captured syndication URLs
        if: steps.changed.outputs.files != ''
        run: |
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content/
            # [skip ci] keeps both this workflow and Cloudflare Workers Builds
            # from rebuilding on the syndication commit-back.
            git commit -m "chore: capture syndication URLs [skip ci]"
            git push
          else
            echo "No syndication URL changes to commit."
          fi
